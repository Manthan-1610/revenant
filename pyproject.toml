[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenant"
version = "0.1.0"
description = "Resurrect dead cloud APIs from their remains in the Internet Archive."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2,<3",
    "typer",
    "rich",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[project.scripts]
revenant = "revenant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["revenant"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = [
    "live: tests that talk to the real Internet Archive (deselected by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["victims", ".venv", ".kiro"]
